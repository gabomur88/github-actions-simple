name: CI Python con Matrix SonarQube y Artifact

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:

  # ==========================================================
  # JOB 1 - MATRIX
  # Ejecuta la misma prueba en 6 combinaciones
  # ==========================================================

  test:

    name: ${{ matrix.os }} - Python ${{ matrix.python }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python:
          - "3.12"
          - "3.13"

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m pytest -v

      - name: Construir aplicacion
        run: python scripts/build.py

      - name: Smoke test
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: python scripts/smoke_test.py


  # ==========================================================
  # JOB 2 - SONARQUBE + QUALITY GATE
  # Solo empieza si los 6 jobs anteriores pasan
  # ==========================================================

  sonar:

    name: SonarQube y Quality Gate

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests con cobertura
        run: |
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Verificar coverage.xml
        run: ls -lh coverage.xml

      - name: Analizar con SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300


  # ==========================================================
  # JOB 3 - CREAR RELEASE Y GUARDAR ARTIFACT
  # Solo se ejecuta si SonarQube / Quality Gate pasan
  # ==========================================================

  package:

    name: Crear artefacto final

    needs: sonar

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Construir aplicacion final
        run: python scripts/build.py

      - name: Preparar release
        run: |
          mkdir -p release
          cp dist/simpleapp.pyz release/
          cp requirements.txt release/

      - name: Mostrar contenido release
        run: ls -lh release/

      - name: Guardar artifact en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: simpleapp-release
          path: release/
          retention-days: 7
