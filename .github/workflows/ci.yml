name: CI Python con Matrix SonarQube y Artifact

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:

  # ==========================================================
  # JOB 1 - MATRIX
  # Ejecuta la misma prueba en 6 combinaciones
  # ==========================================================

  test:

    name: ${{ matrix.os }} - Python ${{ matrix.python }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python:
          - "3.12"
          - "3.13"

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m pytest -v

      - name: Construir aplicacion
        run: python scripts/build.py

      - name: Smoke test
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: python scripts/smoke_test.py


  # ==========================================================
  # JOB 2 - SONARQUBE + QUALITY GATE
  # Solo empieza si los 6 jobs anteriores pasan
  # ==========================================================

  sonar:

    name: SonarQube y Quality Gate

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests con cobertura
        run: |
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Verificar coverage.xml
        run: ls -lh coverage.xml

      - name: Analizar con SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300


  # ==========================================================
  # JOB 3 - CREAR RELEASE Y GUARDAR ARTIFACT
  # Solo se ejecuta si SonarQube / Quality Gate pasan
  # ==========================================================

  package:

    name: Crear artefacto final

    needs: sonar

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Construir aplicacion final
        run: python scripts/build.py

      - name: Preparar release
        run: |
          mkdir -p release
          cp dist/simpleapp.pyz release/
          cp requirements.txt release/

      - name: Mostrar contenido release
        run: ls -lh release/

      - name: Guardar artifact en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: simpleapp-release
          path: release/
          retention-days: 7


  # ==========================================================
  # JOB 4 - DEPLOY EN MI UBUNTU
  # ==========================================================

  deploy:

    name: Deploy en gabomurdevops

    needs: package

    # Este job ya NO corre en una maquina de GitHub.
    # Corre en nuestra propia VM Ubuntu.
    runs-on: self-hosted

    # Solo desplegar cuando hacemos push a main.
    # Los Pull Requests NO despliegan.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # Descargar EXACTAMENTE el artifact creado por package
      # ------------------------------------------------------

      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: simpleapp-release
          path: release


      # ------------------------------------------------------
      # Mostrar lo que descargamos
      # ------------------------------------------------------

      - name: Ver artifact descargado
        run: |
          echo "=== Artifact descargado ==="
          ls -lh release/


      # ------------------------------------------------------
      # Copiar el release a una carpeta permanente
      # de nuestra Ubuntu
      # ------------------------------------------------------

      - name: Preparar aplicacion
        run: |
          mkdir -p "$HOME/apps/github-actions-simple"

          cp release/simpleapp.pyz \
             "$HOME/apps/github-actions-simple/"

          cp release/requirements.txt \
             "$HOME/apps/github-actions-simple/"


      # ------------------------------------------------------
      # Crear el entorno Python e instalar dependencias
      # ------------------------------------------------------

      - name: Preparar entorno Python
        run: |
          cd "$HOME/apps/github-actions-simple"

          if [ ! -d venv ]; then
            python3 -m venv venv
          fi

          ./venv/bin/python -m pip install --upgrade pip

          ./venv/bin/python -m pip install \
            -r requirements.txt


      # ------------------------------------------------------
      # Detener una version anterior si existe
      # ------------------------------------------------------

      - name: Detener version anterior
        run: |
          cd "$HOME/apps/github-actions-simple"

          if [ -f app.pid ]; then

            OLD_PID=$(cat app.pid)

            if kill -0 "$OLD_PID" 2>/dev/null; then
              echo "Deteniendo PID $OLD_PID"
              kill "$OLD_PID"
              sleep 2
            fi

            rm -f app.pid

          fi


      # ------------------------------------------------------
      # Arrancar el artifact que CI construyo
      # ------------------------------------------------------

      - name: Iniciar nueva version
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          cd "$HOME/apps/github-actions-simple"

          # Evita que GitHub Actions mate el proceso
          # al terminar el job.
          unset RUNNER_TRACKING_ID

          DEMO_SECRET="$DEMO_SECRET" \
          nohup ./venv/bin/python simpleapp.pyz \
            > app.log 2>&1 &

          echo $! > app.pid

          echo "Aplicacion iniciada con PID:"
          cat app.pid


      # ------------------------------------------------------
      # Health check
      # ------------------------------------------------------

      - name: Verificar deploy
        run: |
          echo "Esperando que la aplicacion responda..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:8000/health; then

              echo
              echo "DEPLOY CORRECTO"
              exit 0

            fi

            echo "Intento $i/30..."
            sleep 1

          done

          echo "ERROR: la aplicacion no respondio"

          cat "$HOME/apps/github-actions-simple/app.log"

          exit 1
