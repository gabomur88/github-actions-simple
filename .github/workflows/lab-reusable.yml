name: LAB - Reusable Workflow + Artifact + Deploy

on:
  workflow_dispatch:

jobs:

  pruebas:
    uses: ./.github/workflows/reusable-build.yml

    with:
      python-version: "3.13"

    secrets:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}


  sonar:
    name: SonarQube y Quality Gate

    needs: pruebas

    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests con cobertura
        run: |
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Ejecutar SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300


  deploy:
    name: Deploy reutilizable en gabomurdevops

    needs:
      - pruebas
      - sonar

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: simpleapp-release
          path: release

      - name: Ver artifact
        run: |
          echo "=== ARTIFACT DESCARGADO ==="
          ls -lh release/

      - name: Copiar aplicacion
        run: |
          APP_DIR="$HOME/apps/github-actions-simple"

          mkdir -p "$APP_DIR"

          cp release/simpleapp.pyz "$APP_DIR/"
          cp release/requirements.txt "$APP_DIR/"

      - name: Preparar entorno Python
        run: |
          APP_DIR="$HOME/apps/github-actions-simple"

          cd "$APP_DIR"

          if [ ! -d venv ]; then
            python3 -m venv venv
          fi

          ./venv/bin/python -m pip install -r requirements.txt

      - name: Detener aplicacion anterior
        run: |
          APP_DIR="$HOME/apps/github-actions-simple"

          cd "$APP_DIR"

          if [ -f app.pid ]; then

            OLD_PID=$(cat app.pid)

            if kill -0 "$OLD_PID" 2>/dev/null; then
              echo "Deteniendo PID $OLD_PID"
              kill "$OLD_PID"
              sleep 2
            fi

            rm -f app.pid
          fi

      - name: Iniciar aplicacion
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          APP_DIR="$HOME/apps/github-actions-simple"

          cd "$APP_DIR"

          unset RUNNER_TRACKING_ID

          DEMO_SECRET="$DEMO_SECRET" \
          nohup ./venv/bin/python simpleapp.pyz > app.log 2>&1 &

          echo $! > app.pid

          echo "Aplicacion iniciada"
          cat app.pid

      - name: Health check final
        run: |
          echo "Esperando aplicacion..."

          for i in $(seq 1 30); do

            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "DEPLOY CORRECTO"
              exit 0
            fi

            echo "Intento $i/30"
            sleep 1

          done

          echo "ERROR: la aplicacion no respondio"

          cat "$HOME/apps/github-actions-simple/app.log"

          exit 1
