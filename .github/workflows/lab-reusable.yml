name: Build y Test Reutilizable Python

on:
  workflow_call:
    inputs:
      python-version:
        description: "Version de Python que se utilizara"
        required: true
        type: string
    secrets:
      DEMO_SECRET:
        required: true

jobs:
  build-test:
    name: Build y Test Python ${{ inputs.python-version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m pytest -v

      - name: Construir aplicacion
        run: python scripts/build.py

      - name: Smoke test
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: python scripts/smoke_test.py

      - name: Preparar artifact
        run: |
          rm -rf release
          mkdir -p release
          cp dist/simpleapp.pyz release/
          cp requirements.txt release/
          echo "=== Contenido del release ==="
          ls -lh release/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: simpleapp-release
          path: release/
          retention-days: 7
